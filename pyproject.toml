[project]
name = "osmfinder"
version = "0.1.0"
description = "Find and download OpenStreetMap *.osm.pbf extracts by name, id or geometry."
readme = "README.md"
authors = [{ name = "Kamil Raczycki", email = "kraczycki@kraina.ai" }]
requires-python = ">=3.10"
dependencies = [
    "shapely>=2",
    "pyproj>=3",
    "pooch>=1.6.0",
    "requests",
    "beautifulsoup4",
    "rich>=12.0.0",
    "tqdm>=4.42.0",
    "platformdirs>=2",
    "anyascii>=0.3.3",
    "python-dateutil>=2.8",
    "arro3-core",
    "arro3-io",
]
license = { text = "MIT" }
keywords = ["openstreetmap", "osm", "pbf", "extract", "geofabrik", "bbbike", "gis", "download"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/RaczeQ/osmfinder"
Repository = "https://github.com/RaczeQ/osmfinder"
Changelog = "https://github.com/RaczeQ/osmfinder/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "bumpver>=2025.1131",
    "ipykernel",
    "jupyter",
    "matplotlib",
    "folium",
    "mapclassify",
]
lint = [
    "pre-commit>=4.3.0",
    "ruff>=0.14.0",
    "mypy>=1",
    "docformatter[tomli]>=1.7",
    "types-requests",
    "types-python-dateutil",
]
test = [
    "pytest>=8.4.2",
    "pytest-mock>=3.3.0",
    "requests-mock>=1.12.1",
    "pytest-check>=2.3.1",
    "pytest-doctestplus>=1.2.1",
    "pytest-parametrization>=2022.2.1",
    "rq_geo_toolkit>=2026.6.0",
    "geoparquet-io>=1.3.0",
    "tox-uv>=1.29.0",
    "coverage>=7",
]

[build-system]
requires = ["uv_build>=0.9.1,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "osmfinder"
module-root = ""

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
preview = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["old"]

[tool.ruff.lint]
select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "UP",  # pyupgrade
    "D",   # pydocstyle
    "I",   # isort
    "B",   # flake8-bugbear
    "NPY", # NumPy
    "YTT", # flake8-2020
    "Q",   # flake8-quotes
    "PLE",
    "PLW", # pylint (add "PLR" in the future)
    "PIE", # misc lints
    "TID", # tidy imports
    "ISC", # implicit string concatenation
    "TCH", # type-checking imports
]
ignore = ["D212"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.mypy]
strict = true
show_column_numbers = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.docformatter]
syntax = 'google'
black = true
recursive = true
wrap-summaries = 100
wrap-descriptions = 100
tab-width = 4
blank = false
pre-summary-newline = true
close-quotes-on-newline = true
wrap-one-line = true

[tool.bumpver]
current_version = "0.1.0"
version_pattern = "MAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "chore(CI/CD): bump version {old_version} -> {new_version}"
commit = true
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    '^current_version = "{version}"$',
    '^version = "{version}"$',
]
"osmfinder/__init__.py" = ['^__version__ = "{version}"$']

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
doctest_optionflags = [
    'ELLIPSIS',
    'NORMALIZE_WHITESPACE',
    'IGNORE_EXCEPTION_DETAIL',
]
